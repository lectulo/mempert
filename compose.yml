name: mempert

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      SELF_HOSTED: "true"
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      DB_PATH: /data/app.sqlite
      MEDIA_ROOT: /data/media
      MEDIA_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      THUMB_URL: http://thumb:8080
      SCRAPER_URL: http://scraper:8080
      COBALT_URL: http://cobalt:9000/
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:?Set SCRAPER_API_KEY in .env}
      WORKER_SECRET: ${WORKER_SECRET:?Set WORKER_SECRET in .env}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - app-data:/data
    depends_on:
      thumb:
        condition: service_started
      scraper:
        condition: service_started
      cobalt:
        condition: service_started
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 60s
    logging: *logging

  zip-worker:
    build:
      context: .
      dockerfile: container/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      INTERNAL_URL: http://app:3000
      WORKER_SECRET: ${WORKER_SECRET:?Set WORKER_SECRET in .env}
      WORKER_KINDS: zip,export
      GOMAXPROCS: "2"
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 60s
    logging: *logging

  analyze-worker:
    build:
      context: .
      dockerfile: analyze/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      INTERNAL_URL: http://app:3000
      WORKER_SECRET: ${WORKER_SECRET:?Set WORKER_SECRET in .env}
      WORKER_KINDS: analyze
      GOMAXPROCS: "2"
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 60s
    logging: *logging

  thumb:
    build:
      context: .
      dockerfile: thumb/Dockerfile
    environment:
      GOMAXPROCS: "2"
    restart: unless-stopped
    init: true
    expose: ["8080"]
    logging: *logging

  scraper:
    build: ./scraper
    restart: unless-stopped
    init: true
    expose: ["8080"]
    environment:
      API_KEYS: ${SCRAPER_API_KEY:?Set SCRAPER_API_KEY in .env}
      MAX_BROWSERS: "1"
      GOMAXPROCS: "2"
      DIRECT: "1"
    shm_size: 256mb
    logging: *logging

  cobalt:
    image: ${COBALT_IMAGE:-ghcr.io/imputnet/cobalt:11}
    restart: unless-stopped
    init: true
    read_only: true
    expose: ["9000"]
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: "9000"
      API_LISTEN_ADDRESS: 0.0.0.0
      # A single process uses in-memory tunnel state; no Redis is needed.
      API_INSTANCE_COUNT: "1"
      CORS_WILDCARD: "0"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  tiktok:
    profiles: [tiktok]
    build: ./tiktok-sync
    restart: unless-stopped
    environment:
      MEMESAVE_URL: http://app:3000
      MEMESAVE_TOKEN: ${TIKTOK_API_TOKEN:-}
      INTERVAL: ${TIKTOK_INTERVAL:-1800}
      BACKFILL: ${TIKTOK_BACKFILL:-50}
      DOWNLOAD_THREADS: "1"
    volumes:
      - tiktok-data:/data
    shm_size: 256mb
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  app-data:
  tiktok-data:
